services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: >
      sh -lc "mkdir -p storage/app/private storage/app/public storage/app/livewire-tmp storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs &&
      touch storage/app/private/database.sqlite &&
      chmod -R a+rwX storage bootstrap/cache &&
      composer install --no-interaction --prefer-dist &&
      php-fpm"
    environment:
      APP_NAME: "Guia de Empresas da Igreja"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      APP_FAKER_LOCALE: pt_BR
      APP_TIMEZONE: America/Sao_Paulo
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/private/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - .:/var/www/html
      - composer-vendor:/var/www/html/vendor
      - sqlite-data:/var/www/html/storage/app/private
      - public-storage:/var/www/html/storage/app/public
      - livewire-temp:/var/www/html/storage/app/livewire-tmp
      - framework-storage:/var/www/html/storage/framework
      - logs-storage:/var/www/html/storage/logs
    expose:
      - "9000"

  web:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - public-storage:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  assets:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5174:5173"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules

volumes:
  composer-vendor:
  sqlite-data:
  public-storage:
  livewire-temp:
  framework-storage:
  logs-storage:
  node-modules:
